<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaughBook - Login</title>
    <link rel="icon" href="./Assets/Images/gemini-svg (1).svg" type="image/svg+xml">
    <!-- StyleSheet Link -->
    <link rel="stylesheet" href="./Assets/StyleSheets/Common.css">
    <link rel="stylesheet" href="./Assets/StyleSheets/Login.css">
    <!-- Boot Strap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <main class="auth-wrapper d-flex flex-column align-items-center justify-content-center min-vh-100 px-3">

        <!-- Logo Header -->
        <div class="auth-brand mb-4 text-center">
            <h1 class="h3 fw-bold text-white d-flex align-items-center justify-content-center gap-2 m-0">
                <span><img src="./Assets/Images/logo.png" alt="Logo" height="150" width="150"></span>LaughBook
            </h1>
        </div>

        <!-- Centered Login Card -->
        <div class="card bg-dark-card border-secondary-subtle p-4 p-sm-5 auth-card text-white">
            <h2 class="h4 fw-bold mb-1 text-dark">Welcome back</h2>
            <p class="text-secondary small mb-4">Log in to grab your seat for tonight's show.</p>

            <!-- Added id="loginForm" -->
            <form id="loginForm">
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="loginEmail" class="form-label text-secondary small mb-1">Email</label>
                    <input type="email" class="form-control custom-input" id="loginEmail" placeholder="you@example.com"
                        required>
                </div>

                <!-- Password Input -->
                <div class="mb-3 position-relative">
                    <label for="loginPassword" class="form-label text-secondary small mb-1">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control custom-input border-end-0" id="loginPassword"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="form-check mb-4">
                    <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary small" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-purple w-100 fw-semibold py-2 rounded-3 mb-3">
                    Log In
                </button>
            </form>
        </div>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Authentication Script -->
    <script src="./Assets/JavaScripts/Login.js"></script>
</body>

</html>
