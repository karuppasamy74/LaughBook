<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaughBook - My Profile</title>
    <link rel="icon" href="./Assets/Images/gemini-svg (1).svg" type="image/svg+xml">
    
    <!-- StyleSheet Links -->
    <link rel="stylesheet" href="./Assets/StyleSheets/Common.css">
    <link rel="stylesheet" href="./Assets/StyleSheets/Profile.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <header>
        <!-- Navbar Header -->
        <nav class="navbar navbar-expand-lg custom-navbar border-bottom border-secondary border-opacity-25 bg-white">
            <div class="container-fluid px-4">

                <!-- Brand / Logo Image -->
                <a class="navbar-brand d-flex align-items-center gap-2 me-4" href="./index.html">
                    <img src="./Assets/Images/logo.png" alt="Logo" class="brand-logo" style="height: 40px;">
                    <span class="brand-title fw-bold fs-4 text-dark">LaughBook</span>
                </a>

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Nav Items Container -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <div class="d-flex align-items-center gap-4 ms-auto mt-3 mt-lg-0">
                        <ul class="navbar-nav d-flex flex-row gap-4 mb-0">
                            <li class="nav-item">
                                <a class="nav-link text-secondary" href="./index.html">Discover</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-secondary" href="./booking.html">My Bookings</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-secondary" href="./contact.html">Contact</a>
                            </li>
                        </ul>

                        <!-- User Profile Avatar Circle -->
                        <div class="profile-avatar rounded-circle d-flex align-items-center justify-content-center bg-purple text-white fw-bold overflow-hidden" 
                            id="profileAvatarContainer" style="width: 40px; height: 40px;">
                            <span id="profileAvatarText">K</span>
                        </div>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main class="container my-5 profile-container" style="max-width: 650px;">

        <!-- Page Header -->
        <header class="mb-4">
            <h1 class="fw-bold fs-2 mb-0 text-dark">My Profile</h1>
        </header>

        <!-- User Avatar & Basic Info with Image Upload -->
        <section class="d-flex align-items-center gap-3 mb-4">
            <div class="position-relative">
                <!-- Avatar Container -->
                <div class="rounded-circle border border-2 border-warning overflow-hidden bg-purple text-white d-flex align-items-center justify-content-center fw-bold fs-3" 
                     id="avatarCircle" style="width: 85px; height: 85px;">
                    <span id="avatarInitials">K</span>
                </div>
                
                <!-- Hidden Image Input -->
                <input type="file" id="imageUploadInput" accept="image/*" class="d-none">
                
                <!-- Upload Camera Button Overlay -->
                <button type="button" id="triggerUploadBtn" class="position-absolute bottom-0 end-0 btn btn-sm btn-purple rounded-circle p-1 shadow" title="Upload Profile Picture" style="width: 28px; height: 28px; line-height: 1;">
                    📷
                </button>
            </div>
            <div>
                <h2 class="h5 fw-bold mb-1 text-uppercase text-dark" id="displayProfileName">Loading Name...</h2>
                <p class="text-secondary small mb-0" id="displayProfileEmail">Loading Email...</p>
            </div>
        </section>

        <!-- Stat Cards Row (Total Bookings & Total Spent) -->
        <section class="row g-3 mb-4">
            <div class="col-6">
                <div class="card bg-white border-secondary-subtle p-3 text-center h-100 shadow-sm rounded-4">
                    <span class="stat-number text-purple fw-bold fs-2" id="statTotalBookings">0</span>
                    <span class="text-secondary extra-small">Total Shows Booked</span>
                </div>
            </div>
            <div class="col-6">
                <div class="card bg-white border-secondary-subtle p-3 text-center h-100 shadow-sm rounded-4">
                    <span class="stat-number text-purple fw-bold fs-2" id="statTotalSpent">$0.00</span>
                    <span class="text-secondary extra-small">Total Spent</span>
                </div>
            </div>
        </section>

        <!-- Account Details & Password Change Form Card -->
        <section class="card bg-white border-secondary-subtle p-4 mb-3 shadow-sm rounded-4">
            <h3 class="h6 fw-bold text-dark mb-3">Account Details</h3>

            <form id="profileForm">
                <!-- Name Input -->
                <div class="mb-3">
                    <label for="profileName" class="form-label text-secondary small mb-1">Full Name</label>
                    <input type="text" class="form-control custom-input" id="profileName" placeholder="Enter name">
                </div>

                <!-- Email Input -->
                <div class="mb-3">
                    <label for="profileEmail" class="form-label text-secondary small mb-1">Email Address</label>
                    <input type="email" class="form-control custom-input" id="profileEmail" placeholder="Enter email">
                </div>

                <!-- Change Password Toggle Link -->
                <div class="mb-3">
                    <a class="text-purple-link small text-decoration-none fw-semibold" data-bs-toggle="collapse" href="#passwordCollapse" role="button" aria-expanded="false" aria-controls="passwordCollapse">
                        🔒 Change Password?
                    </a>
                </div>

                <!-- Collapsible Password Section -->
                <div class="collapse mb-4" id="passwordCollapse">
                    <div class="p-3 bg-light rounded-3 border">
                        <div class="mb-2">
                            <label for="currentPassword" class="form-label text-secondary extra-small mb-1">Current Password</label>
                            <input type="password" class="form-control custom-input form-control-sm" id="currentPassword" placeholder="Enter current password">
                        </div>
                        <div class="mb-2">
                            <label for="newPassword" class="form-label text-secondary extra-small mb-1">New Password</label>
                            <input type="password" class="form-control custom-input form-control-sm" id="newPassword" placeholder="Enter new password">
                        </div>
                        <div>
                            <label for="confirmPassword" class="form-label text-secondary extra-small mb-1">Confirm New Password</label>
                            <input type="password" class="form-control custom-input form-control-sm" id="confirmPassword" placeholder="Confirm new password">
                        </div>
                    </div>
                </div>

                <!-- Save Changes Button -->
                <div class="d-flex align-items-center gap-3 mb-4">
                    <button type="button" id="saveProfileBtn" class="btn btn-purple rounded-pill px-4 py-2 fw-semibold">
                        Save Changes
                    </button>
                </div>

                <hr class="border-secondary opacity-25 my-3">

                <!-- Dark / Light Mode Switch -->
                <div class="d-flex justify-content-between align-items-center pt-2">
                    <span class="small fw-semibold text-dark">Dark / Light Mode</span>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input custom-switch" type="checkbox" role="switch" id="themeToggle">
                    </div>
                </div>
            </form>
        </section>

        <!-- Logout Button -->
        <section class="mt-3">
            <button type="button" class="btn btn-danger w-100 rounded-pill py-2 fw-semibold btn-logout">
                Logout
            </button>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-white border-top">
        <div class="container text-center">
            <span class="text-muted small">&copy; 2026 LaughBook. All rights reserved.</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Profile JavaScript -->
    <script src="./Assets/JavaScripts/Profile.js"></script>
    <script src="./Assets/JavaScripts/index.js"></script>
</body>

</html>
