<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaughBook - Register</title>
    <link rel="icon" href="./Assets/Images/gemini-svg (1).svg" type="image/svg+xml">
    <!-- StyleSheet Link -->
    <link rel="stylesheet" href="./Assets/StyleSheets/Common.css">
    <link rel="stylesheet" href="./Assets/StyleSheets/Register.css">
    <!-- Boot Strap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <main class="auth-wrapper d-flex flex-column align-items-center justify-content-center min-vh-100 px-3 py-4">

        <!-- Logo Header -->
        <div class="auth-brand mb-4 text-center">
            <h1 class="h3 fw-bold text-white d-flex align-items-center justify-content-center gap-2 m-0">
                <span><img src="./Assets/Images/logo.png" alt="Logo" height="150" width="150"></span> LaughBook
            </h1>
        </div>

        <!-- Centered Register Card -->
        <div class="card bg-dark-card border-secondary-subtle p-4 p-sm-5 auth-card text-white">
            <h2 class="h4 fw-bold mb-1 text-dark">New here?</h2>
            <p class="text-secondary small mb-4">Create an account to start booking shows.</p>

            <!--registerForm-->
            <form id="registerForm">
                <!-- Name Input -->
                <div class="mb-3">
                    <label for="regName" class="form-label text-secondary small mb-1">Name</label>
                    <input type="text" class="form-control custom-input" id="regName" placeholder="Jordan Lee" required>
                </div>

                <!-- Email Input -->
                <div class="mb-3">
                    <label for="regEmail" class="form-label text-secondary small mb-1">Email</label>
                    <input type="email" class="form-control custom-input" id="regEmail" placeholder="you@example.com"
                        required>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="regPassword" class="form-label text-secondary small mb-1">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control custom-input border-end-0" id="regPassword"
                            placeholder="At least 8 characters" required>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="regConfirmPassword" class="form-label text-secondary small mb-1">Confirm
                        Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control custom-input border-end-0" id="regConfirmPassword"
                            placeholder="Re-enter password" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-warning w-100 text-dark fw-bold py-2 rounded-3 mb-3">
                    Register
                </button>
            </form>
        </div>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Authentication Script -->
    <script src="./Assets/JavaScripts/Register.js"></script>
</body>

</html>
